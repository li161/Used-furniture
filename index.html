<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#241b14"><title>旧物小店</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#211910}#scene{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 44%,transparent 35%,#130e09a8 100%),linear-gradient(0deg,#130e09a0,transparent 28%);z-index:2}#dust{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.1;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}#sign{position:fixed;z-index:4;top:22px;left:26px;color:#e5d0ac;font:13px/1.8 serif;letter-spacing:.18em;text-shadow:0 2px 12px #000;pointer-events:none;opacity:.82}#sign small{display:block;font:10px/1.8 sans-serif;letter-spacing:.24em;color:#c6ad88}#hint{position:fixed;z-index:4;bottom:22px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#dfc9a5a8;font:10px sans-serif;letter-spacing:.16em;text-shadow:0 2px 10px #000;pointer-events:none}@media(max-width:650px){#sign{top:16px;left:16px}#hint{bottom:15px;font-size:9px}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"}}</script></head>
<body><div id="scene"></div><div id="vignette"></div><div id="dust"></div><div id="sign">旧物小店<small>每件旧物，都有自己的来处</small></div><div id="hint">移动视线环顾店铺 · 滚动向里走 · 反向滚动回到门口</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#2a2118');scene.fog=new THREE.FogExp2('#2a2118',.019);
const camera=new THREE.PerspectiveCamera(61,innerWidth/innerHeight,.1,100);camera.position.set(0,2.35,10.5);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.28;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.querySelector('#scene').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe9c99b,0x21170f,1.2));const warm=new THREE.DirectionalLight(0xffd09a,3.5);warm.position.set(-5,9,5);warm.castShadow=true;warm.shadow.mapSize.set(2048,2048);scene.add(warm);
function lamp(x,y,z,p=55){const l=new THREE.PointLight(0xffbd73,p,12,2);l.position.set(x,y,z);scene.add(l);const c=new THREE.Mesh(new THREE.SphereGeometry(.13,16,12),new THREE.MeshBasicMaterial({color:0xffd49a}));c.position.copy(l.position);scene.add(c)}lamp(-3.5,4.7,-1,65);lamp(2.8,4.8,-5,75);lamp(0,4.6,3,35);
const mat=(c,r=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(24,34),mat('#493727'));floor.rotation.x=-Math.PI/2;floor.position.set(0,-.12,-5);floor.receiveShadow=true;scene.add(floor);
for(let z=10;z>-22;z-=1.1){const p=new THREE.Mesh(new THREE.BoxGeometry(24,.035,1.06),mat(z%2?'#59432f':'#503b29'));p.position.set(0,-.085,z-5);p.receiveShadow=true;scene.add(p)}
const wall=mat('#594638');const left=new THREE.Mesh(new THREE.PlaneGeometry(34,8),wall);left.rotation.y=Math.PI/2;left.position.set(-8,4,-5);scene.add(left);const right=new THREE.Mesh(new THREE.PlaneGeometry(34,8),wall);right.rotation.y=-Math.PI/2;right.position.set(8,4,-5);scene.add(right);const back=new THREE.Mesh(new THREE.PlaneGeometry(16,8),wall);back.position.set(0,4,-22);scene.add(back);const ceiling=new THREE.Mesh(new THREE.PlaneGeometry(16,34),mat('#30251b'));ceiling.rotation.x=Math.PI/2;ceiling.position.set(0,8,-5);scene.add(ceiling);
function box(w,h,d,c,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function rug(x,z,w,d){box(w,.035,d,'#744c35',x,-.045,z);box(w-.18,.04,d-.18,'#a07a55',x,-.015,z)}
function crate(x,z){box(.9,.62,.72,'#65432a',x,.31,z);for(let y=.12;y<.62;y+=.18)box(.94,.045,.76,'#8a603b',x,y,z)}
function floorLamp(x,z){const stem=new THREE.Mesh(new THREE.CylinderGeometry(.035,.045,1.8,12),mat('#987448'));stem.position.set(x,.95,z);scene.add(stem);const shade=new THREE.Mesh(new THREE.CylinderGeometry(.38,.18,.48,20,1,true),mat('#9b8870'));shade.position.set(x,1.95,z);scene.add(shade);const l=new THREE.PointLight(0xffc982,18,5);l.position.set(x,1.9,z);scene.add(l)}
rug(-.3,-.4,5.8,3.4);rug(0,-8,5,3.4);rug(0,7,4.5,2.2);crate(-6.5,5.4);crate(6.1,5.8);floorLamp(-5.9,3.3);floorLamp(4.3,-4.7);
const loader=new GLTFLoader();const assets=[
{url:'https://files.innerscene.com/library/victorian-leather-sofa-3a3ebd7e/5e875109d66562a32c61/polyhaven-sofa-03.glb',width:2.75,positions:[[-4.5,1.6,.1],[4.6,-7,.2]]},
{url:'https://files.innerscene.com/library/victorian-armchair-f000c44f/a2ca475762c8930d0da6/polyhaven-armchair-01.glb',width:1.05,positions:[[-2.5,2.8,-.3],[3.5,2.4,.3],[2.5,-5.6,-.2],[-1.8,-2.4,.1]]},
{url:'https://files.innerscene.com/library/victorian-carved-sofa-812af357/702f0a24fccb9531bad8/polyhaven-sofa-01.glb',width:2.4,positions:[[4.4,-12,.1],[-4.2,-15,-.2]]},
{url:'https://files.innerscene.com/library/victorian-console-table-8d86c520/c206978e362f1a904176/polyhaven-classicconsole-01.glb',width:1.9,positions:[[5.4,1.2,-.15],[-5.3,-7,.1],[0,-19,0]]}
];
let loaded=0;const status={failed:[]};
function placeModel(root,spec,pos){const model=root.clone(true);const bounds=new THREE.Box3().setFromObject(model);const size=bounds.getSize(new THREE.Vector3());const scale=spec.width/Math.max(size.x,size.z);model.scale.setScalar(scale);const b2=new THREE.Box3().setFromObject(model);model.position.set(pos[0],-b2.min.y*scale,pos[1]);model.rotation.y=pos[2];model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;if(o.material){o.material.side=THREE.DoubleSide}}});scene.add(model)}
assets.forEach(spec=>loader.load(spec.url,gltf=>{const root=gltf.scene;spec.positions.forEach(p=>placeModel(root,spec,p));loaded+=spec.positions.length;document.documentElement.dataset.realFurniture=String(loaded)},undefined,error=>{status.failed.push(spec.url);console.error('真实家具模型加载失败',error);document.documentElement.dataset.assetError='true'}));
const clock=new THREE.Clock();let targetX=0,targetY=0,lookX=0,lookY=0,travel=0,lastTouch=0;
window.addEventListener('pointermove',e=>{targetX=(e.clientX/innerWidth-.5)*.75;targetY=(e.clientY/innerHeight-.5)*.28});
window.addEventListener('wheel',e=>{travel=THREE.MathUtils.clamp(travel+e.deltaY*.006,-1.5,11)},{passive:true});
window.addEventListener('touchstart',e=>lastTouch=e.touches[0].clientY,{passive:true});
window.addEventListener('touchmove',e=>{const y=e.touches[0].clientY;targetX=(e.touches[0].clientX/innerWidth-.5)*.5;travel=THREE.MathUtils.clamp(travel+(lastTouch-y)*.018,-1.5,11);lastTouch=y},{passive:true});
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();lookX+=(targetX-lookX)*.035;lookY+=(targetY-lookY)*.035;camera.position.x=lookX*2.8;camera.position.y=2.25+lookY+Math.sin(t*.35)*.018;camera.position.z=10.5-travel;camera.lookAt(lookX*1.7,1.8+lookY*1.4,-5-travel*.8);renderer.render(scene,camera)}animate();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
