</style></head><body><div id="scene"></div><div id="shade"></div><div id="grain"></div><div id="brand"><div id="seal">旧</div><span>旧物新生<br>让时间继续生活</span></div><div id="chapter"><strong id="number">第一件旧物</strong><span id="place">仓库深处 · 午后微光</span></div><div id="story"><div id="age">一九〇〇年前后 · 老橡木与旧皮革</div><h1 id="name">一把被时光<br>留下的椅子</h1><p id="intro">它曾陪伴一个家庭度过漫长岁月。<br>如今，阳光再次落在它的扶手上。</p></div><div id="discovery"><div class="label">你正在注视这件旧物</div><h2 id="detailName">扶手上的岁月</h2><p id="detailText">反复触摸留下的光泽没有被打磨掉。那不是瑕疵，而是它曾被珍惜的证据。</p></div><div id="hint">移动视线，靠近一件旧物 · 上下滑动，走进下一段记忆</div><div id="fade"></div>

import * as THREE from 'three';const $=s=>document.querySelector(s);
const scene=new THREE.Scene();scene.background=new THREE.Color('#191813');scene.fog=new THREE.FogExp2('#191813',.026);
const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,100);camera.position.set(0,3.1,8.5);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;$('#scene').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xbba98c,0x17130e,.85));const sun=new THREE.DirectionalLight(0xffd6a3,4.2);sun.position.set(-5,10,5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);const spot=new THREE.SpotLight(0xffd4a0,95,25,.38,.72,1.4);spot.position.set(-2,8,3);spot.target.position.set(0,1,0);scene.add(spot,spot.target);scene.add(new THREE.DirectionalLight(0x89929a,.65));
const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const oak=mat('#4a2d1c'),oak2=mat('#69472b'),dark=mat('#241a13'),leather=mat('#38251f',.96),worn=mat('#694735',.92),brass=mat('#987448',.45,.7),dustMat=new THREE.PointsMaterial({color:0xe5cda5,size:.035,transparent:true,opacity:.5,depthWrite:false});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(50,50),mat('#29251f'));floor.rotation.x=-Math.PI/2;floor.position.y=-.04;floor.receiveShadow=true;scene.add(floor);const back=new THREE.Mesh(new THREE.PlaneGeometry(28,13),mat('#25221c'));back.position.set(0,6,-8);scene.add(back);
for(let x=-12;x<=12;x+=4){const b=new THREE.Mesh(new THREE.BoxGeometry(.18,.2,18),dark);b.position.set(x,7.5,-.2);b.castShadow=true;scene.add(b)}
const frame=mat('#65543c');for(const x of [-3.1,0,3.1]){const o=new THREE.Mesh(new THREE.BoxGeometry(.12,4.4,.16),frame);o.position.set(x,4.4,-7.75);scene.add(o)}for(const y of [2.2,4.4,6.6]){const o=new THREE.Mesh(new THREE.BoxGeometry(6.3,.12,.16),frame);o.position.set(0,y,-7.75);scene.add(o)}
const dg=new THREE.BufferGeometry(),dp=new Float32Array(3000);for(let i=0;i<1000;i++){dp[i*3]=(Math.random()-.5)*18;dp[i*3+1]=Math.random()*7;dp[i*3+2]=(Math.random()-.5)*15-1}dg.setAttribute('position',new THREE.BufferAttribute(dp,3));const dust=new THREE.Points(dg,dustMat);scene.add(dust);
function box(g,w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;g.add(o);return o}function leg(g,x,z,h,m){const o=new THREE.Mesh(new THREE.CylinderGeometry(.075,.12,h,12),m);o.position.set(x,h/2,z);o.castShadow=true;g.add(o)}
function chair(){const g=new THREE.Group();for(const x of [-.68,.68])for(const z of [-.58,.58])leg(g,x,z,.9,oak);box(g,1.55,.2,1.35,oak2,0,.92,0);box(g,1.36,.16,1.17,leather,0,1.08,0);box(g,1.22,1.05,.16,oak2,0,1.62,-.58);box(g,1.02,.82,.08,worn,0,1.65,-.69);for(const x of [-.68,.68]){box(g,.13,1.1,.13,oak,x,1.48,-.58);box(g,.13,1,.13,oak,x,1.4,.58);const a=new THREE.Mesh(new THREE.CylinderGeometry(.09,.13,1.3,12),oak2);a.rotation.x=Math.PI/2;a.position.set(x,1.65,0);g.add(a)}for(let x=-.4;x<=.4;x+=.2)for(let y=1.35;y<=1.95;y+=.2){const n=new THREE.Mesh(new THREE.SphereGeometry(.025,8,8),brass);n.position.set(x,y,-.685);g.add(n)}return g}
function cabinet(){const g=new THREE.Group();box(g,2.25,2.7,.82,oak,0,1.45,0);box(g,2.45,.18,1,oak2,0,2.88,0);box(g,2.5,.12,1.02,dark,0,.08,0);for(const x of [-.75,0,.75])for(const y of [1.05,2.05]){box(g,.68,.78,.08,oak2,x,y,-.45);box(g,.55,.64,.035,dark,x,y,-.5);const k=new THREE.Mesh(new THREE.SphereGeometry(.065,12,10),brass);k.position.set(x,y,-.56);g.add(k)}for(const x of [-.95,.95])box(g,.12,.22,.12,dark,x,.18,.1);return g}
function table(){const g=new THREE.Group();box(g,2.8,.2,1.35,oak2,0,1.58,0);for(const x of [-1.1,1.1]){box(g,.55,1.48,1.05,oak,x,.8,0);for(let y=.42;y<1.4;y+=.42){box(g,.48,.28,.08,oak2,x,y,-.55);const k=new THREE.Mesh(new THREE.SphereGeometry(.04,10,8),brass);k.position.set(x,y,-.61);g.add(k)}}for(const x of [-1.18,1.18])for(const z of [-.5,.5])box(g,.12,.18,.12,dark,x,.1,z);return g}
const data=[{make:chair,n:'一把被时光<br>留下的椅子',age:'一九〇〇年前后 · 老橡木与旧皮革',intro:'它曾陪伴一个家庭度过漫长岁月。<br>如今，阳光再次落在它的扶手上。',place:'仓库深处 · 午后微光',dn:'扶手上的岁月',dt:'反复触摸留下的光泽没有被打磨掉。那不是瑕疵，而是它曾被珍惜的证据。'},{make:cabinet,n:'沉默的<br>橡木柜',age:'一九一二年 · 深色橡木与黄铜',intro:'抽屉里藏着旧信封、褪色的照片，<br>还有一个家庭没有说完的故事。',place:'仓库后室 · 灰尘与旧信',dn:'抽屉深处',dt:'柜门边缘被岁月磨圆，铜把手已经暗淡。抽屉底板还留着铅笔写下的名字。'},{make:table,n:'仍然记得<br>双手的工作台',age:'一九三〇年前后 · 橡木与铁件',intro:'刀痕、墨迹和浅浅的凹坑，<br>记录着一个匠人漫长的日常。',place:'旧工坊 · 尚未散去的木香',dn:'桌面上的刻痕',dt:'每一道划痕都来自一次真实的制作。它没有被翻新成崭新的样子，只等待下一双手。'}];
const groups=data.map(d=>{const g=new THREE.Group();g.add(d.make());scene.add(g);return g});let index=0,ax=0,ay=0,lx=0,ly=0,lock=false,seen=false,touchY=0;
function update(){const d=data[index];$('#number').textContent=['第一件旧物','第二件旧物','第三件旧物'][index];$('#place').textContent=d.place;$('#age').textContent=d.age;$('#name').innerHTML=d.n;$('#intro').innerHTML=d.intro;$('#detailName').textContent=d.dn;$('#detailText').textContent=d.dt;groups.forEach((g,i)=>g.visible=i===index);$('#story').classList.remove('fade');$('#discovery').classList.remove('show');seen=false}
function move(dir){if(lock)return;const n=Math.max(0,Math.min(2,index+dir));if(n===index)return;lock=true;$('#fade').classList.add('on');setTimeout(()=>{index=n;update();$('#fade').classList.remove('on');setTimeout(()=>lock=false,550)},380)}
window.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>12)move(e.deltaY>0?1:-1)},{passive:true});window.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='PageDown')move(1);if(e.key==='ArrowUp'||e.key==='PageUp')move(-1)});
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();window.addEventListener('pointermove',e=>{ax=(e.clientX/innerWidth-.5)*.72;ay=(e.clientY/innerHeight-.5)*.3;pointer.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(pointer,camera);const found=ray.intersectObjects(groups[index].children,true).length>0;if(found!==seen){seen=found;$('#discovery').classList.toggle('show',found);$('#story').classList.toggle('fade',found)}});
window.addEventListener('touchstart',e=>touchY=e.touches[0].clientY,{passive:true});window.addEventListener('touchend',e=>{const d=touchY-e.changedTouches[0].clientY;if(Math.abs(d)>45)move(d>0?1:-1)},{passive:true});
update();const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();lx+=(ax-lx)*.025;ly+=(ay-ly)*.025;camera.position.set(lx*2.4,3.05+ly+Math.sin(t*.22)*.025,8.5);camera.lookAt(lx*.4,1.25,0);groups[index].rotation.y=Math.sin(t*.17)*.025;dust.rotation.y=t*.009;spot.position.x=-2+Math.sin(t*.14)*.45;renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
