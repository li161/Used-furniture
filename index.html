<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#29251f}
#scene{position:fixed;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}

#grain{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.075;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
#mark{position:fixed;z-index:4;top:23px;left:27px;color:#e7d8bc;text-shadow:0 2px 16px #000;font:20px/1.4 serif;letter-spacing:.22em;pointer-events:none}
#mark small{display:block;margin-top:5px;color:#c5b397;font:10px/1.8 sans-serif;letter-spacing:.2em}
#hint{position:fixed;z-index:4;bottom:21px;left:50%;transform:translateX(-50%);color:#e1d3b6aa;font:10px sans-serif;letter-spacing:.16em;white-space:nowrap;text-shadow:0 2px 12px #000;pointer-events:none}
#status{position:fixed;z-index:4;right:24px;top:25px;color:#c9b99b99;font:9px sans-serif;letter-spacing:.12em;pointer-events:none}

#interact{position:fixed;z-index:8;left:50%;bottom:62px;transform:translateX(-50%);padding:10px 16px;border:1px solid #d9c49a88;background:#201a14d9;color:#f0dfbd;font:13px/1.5 sans-serif;letter-spacing:.08em;display:none;pointer-events:auto;cursor:pointer;user-select:none;box-shadow:0 8px 30px #0006}
#stallCard{position:fixed;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 34px));padding:25px 24px 22px;background:linear-gradient(145deg,#3c2b20f2,#211b16f5);border:1px solid #c5a87899;color:#ead9b8;box-shadow:0 22px 90px #0009;display:none}
#stallCard.show{display:block;animation:arrive .22s ease-out}
#stallCard .eyebrow{font:10px sans-serif;letter-spacing:.22em;color:#c49b68}
#stallCard h2{font:26px serif;font-weight:400;margin:12px 0 9px}
#stallCard p{font:13px/1.9 sans-serif;color:#d0c0a4;margin:0}
#stallCard .sample{margin-top:18px;padding-top:14px;border-top:1px solid #bda07855;font:12px/1.9 sans-serif;color:#e8d7b8}
#stallCard .close{margin-top:20px;color:#c6a77b;font:11px sans-serif;letter-spacing:.15em}
@keyframes arrive{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
#hint{bottom:18px}
@media(max-width:650px){#interact{bottom:58px;font-size:12px}#stallCard{padding:21px 19px}}


#furnitureCard{position:fixed;z-index:11;right:clamp(14px,4vw,54px);bottom:clamp(56px,9vh,92px);width:min(340px,calc(100vw - 28px));padding:20px 21px;background:linear-gradient(145deg,#3c2b20ed,#211b16f2);border:1px solid #c5a87899;color:#ead9b8;box-shadow:0 18px 70px #0009;display:none;pointer-events:none}
#furnitureCard.show{display:block;animation:arrive .2s ease-out}
#furnitureCard .eyebrow{font:10px sans-serif;letter-spacing:.2em;color:#c49b68}
#furnitureCard h3{font:23px serif;font-weight:400;margin:9px 0}
#furnitureCard p{font:12px/1.85 sans-serif;color:#d0c0a4;margin:0}
#furnitureCard .close{margin-top:13px;color:#c6a77b;font:10px sans-serif;letter-spacing:.12em}
#status.error{color:#ffb18b}
#inspectTip{position:fixed;z-index:12;left:50%;top:22px;transform:translateX(-50%);display:none;color:#f0dfbd;background:#211b16c9;border:1px solid #c5a87877;padding:9px 14px;font:11px sans-serif;letter-spacing:.08em;white-space:nowrap;pointer-events:none}
@media(max-width:650px){#furnitureCard{right:12px;bottom:60px;width:min(300px,calc(100vw - 24px));padding:16px}#inspectTip{top:64px;font-size:10px}}

<body>
<div id="scene"></div><div id="shade"></div><div id="grain"></div>
<div id="mark">老物件集<small>一件家具，一段中国家庭的旧时光</small></div>
<div id="status">旧木作 · 老家具 · 旧日常</div>
<div id="hint">W A S D / 方向键行走 · 靠近家具点击查看 · 拖动环绕 · ESC 返回</div>
<div id="interact">靠近家具，点击查看</div>
<section id="furnitureCard"><div class="eyebrow">旧物集 · 单件样品</div><h3 id="furnitureTitle">家具样品</h3><p id="furnitureDesc"></p><div class="close">拖动旋转 · 滚轮缩放 · ESC 返回</div></section><div id="inspectTip">正在查看家具 · 拖动旋转 · 滚轮缩放 · ESC 返回</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color('#777064');
scene.fog=new THREE.FogExp2('#777064',.012);
const camera=new THREE.PerspectiveCamera(59,innerWidth/innerHeight,.1,120);
camera.position.set(0,2.05,14.2);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.38;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.querySelector('#scene').appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xfff0d6,0x37332b,1.65));
const sun=new THREE.DirectionalLight(0xffe8c8,4.2);sun.position.set(-8,12,12);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-13;sun.shadow.camera.right=13;sun.shadow.camera.top=13;sun.shadow.camera.bottom=-13;scene.add(sun);
function glow(x,y,z,p=30,color=0xffc98c,range=10){const l=new THREE.PointLight(color,p,range,2);l.position.set(x,y,z);scene.add(l)}
glow(-4,5,0,28);glow(4,5,-8,24);glow(0,4,-19,20);

const material=(c,r=.88,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const brick=material('#71675a'),agedBrick=material('#655b4d'),wood=material('#493322'),darkWood=material('#30251c'),red=material('#71372b'),stone=material('#777064'),roof=material('#34352f'),metal=material('#393a36',.62,.65);
function mesh(geo,mat,x,y,z,rx=0,ry=0,rz=0,cast=true){const o=new THREE.Mesh(geo,mat);o.position.set(x,y,z);o.rotation.set(rx,ry,rz);o.castShadow=cast;o.receiveShadow=true;scene.add(o);return o}
function beam(x,y,z,w,h,d,ry=0,c=wood){return mesh(new THREE.BoxGeometry(w,h,d),material(c),x,y,z,0,ry,0)}
// 旧街铺空间：灰砖、木梁、坡屋檐、青灰瓦棚
mesh(new THREE.PlaneGeometry(22,42),stone,0,-.12,-8,-Math.PI/2);
for(let z=11;z>-29;z-=2.4)for(let x=-9;x<9;x+=2.4){
  mesh(new THREE.BoxGeometry(2.34,.035,2.34),material(((Math.round(z/2.4)+Math.round(x/2.4))%2)?'#827b6e':'#70695e'),x,-.085,z);
}
for(let z=11;z>-29;z-=3.5){
  for(const x of [-8,8])beam(x,3.5,z,.32,7,.34,0,'#4b3a2a');
  beam(0,7.05,z,16,.28,.32,0,'#493626');
}
for(const x of [-8.2,8.2])mesh(new THREE.PlaneGeometry(42,7),brick,x,3.6,-8,0,x<0?Math.PI/2:-Math.PI/2);
mesh(new THREE.PlaneGeometry(16,7),agedBrick,0,3.6,-29);
for(let z=10;z>-28;z-=3.1){
  beam(0,7.25,z,17,.22,.24,0,'#382b20');
  beam(0,7.7,z,17,.13,.18,0,'#59432d');
}
// 前檐、木门头与中国旧店招
beam(0,6.45,9.2,17,.34,.48,0,'#39291f');
beam(0,6.08,9.15,13,.12,.5,0,'#8a603b');
function signTexture(lines,bg,fg){const c=document.createElement('canvas');c.width=512;c.height=256;const g=c.getContext('2d');g.fillStyle=bg;g.fillRect(0,0,512,256);g.strokeStyle='#c6a77b';g.lineWidth=8;g.strokeRect(12,12,488,232);g.fillStyle=fg;g.textAlign='center';g.textBaseline='middle';g.font='bold 82px serif';g.fillText(lines[0],256,104);g.font='28px serif';g.fillText(lines[1],256,190);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const signMat=new THREE.MeshStandardMaterial({map:signTexture(['旧货','收旧木器 · 家具寄卖'],'#593327','#e8d4aa'),roughness:.9});
mesh(new THREE.PlaneGeometry(3.2,1.55),signMat,0,5.25,8.88,0,0,0,false);
// 入口两侧老式木格窗，建筑构件而非家具
function lattice(x,z){const g=new THREE.Group();g.position.set(x,2.55,z);for(let y=0;y<7;y++)for(let a=0;a<5;a++){const v=new THREE.Mesh(new THREE.BoxGeometry(.055,1.55,.07),material('#473426'));v.position.set(a*.32-.64,y*.22-.66,0);g.add(v)}for(let y=0;y<8;y++){const h=new THREE.Mesh(new THREE.BoxGeometry(1.35,.055,.07),material('#473426'));h.position.set(0,y*.22-.77,0);g.add(h)}scene.add(g)}
lattice(-7.72,4.5);lattice(7.72,4.5);
// 老式青砖墙脚、剥落灰泥层和水渍
for(let z=8;z>-27;z-=1.25){mesh(new THREE.BoxGeometry(.08,.52,1.18),material(z%2?'#51483e':'#5d5144'),-7.88,.28,z);mesh(new THREE.BoxGeometry(.08,.52,1.18),material(z%2?'#5b5044':'#51483e'),7.88,.28,z)}
// 成组悬挂的中式红纱灯笼：灯骨、绸面、穗子与暖色照明
const lanternLights=[];
function lantern(x,y,z,scale=1,redTone='#a52f25'){
 const g=new THREE.Group();g.position.set(x,y,z);g.scale.setScalar(scale);scene.add(g);
 const silkCanvas=document.createElement('canvas');silkCanvas.width=256;silkCanvas.height=256;
 const sg=silkCanvas.getContext('2d');const grad=sg.createLinearGradient(0,0,256,0);
 grad.addColorStop(0,'#681c19');grad.addColorStop(.28,redTone);grad.addColorStop(.55,'#d45a3e');grad.addColorStop(.78,redTone);grad.addColorStop(1,'#651b18');
 sg.fillStyle=grad;sg.fillRect(0,0,256,256);
 for(let i=0;i<28;i++){sg.strokeStyle='rgba(255,211,157,'+(0.025+i%3*.012)+')';sg.lineWidth=1;sg.beginPath();sg.moveTo(i*10,0);sg.lineTo(i*10,256);sg.stroke()}
 sg.fillStyle='rgba(246,202,132,.8)';sg.font='bold 40px serif';sg.textAlign='center';sg.fillText('福',128,142);
 const silkTex=new THREE.CanvasTexture(silkCanvas);silkTex.colorSpace=THREE.SRGBColorSpace;
 const silk=new THREE.Mesh(new THREE.SphereGeometry(.42,24,18),new THREE.MeshStandardMaterial({map:silkTex,color:0xffffff,roughness:.82,transparent:true,opacity:.94,emissive:0x5b160e,emissiveIntensity:.22}));
 silk.scale.set(.86,1.12,.86);silk.castShadow=true;g.add(silk);
 const brass=material('#a77a3e',.48,.6);
 for(const yy of [-.43,.43]){const rim=new THREE.Mesh(new THREE.TorusGeometry(.34,.035,8,28),brass);rim.position.y=yy;rim.rotation.x=Math.PI/2;g.add(rim)}
 const capTop=new THREE.Mesh(new THREE.CylinderGeometry(.17,.28,.12,12),brass);capTop.position.y=.49;g.add(capTop);
 const capBottom=new THREE.Mesh(new THREE.CylinderGeometry(.28,.15,.12,12),brass);capBottom.position.y=-.49;g.add(capBottom);
 for(let i=0;i<12;i++){const a=i/12*Math.PI*2;const rib=new THREE.Mesh(new THREE.CylinderGeometry(.009,.009,.91,5),brass);rib.position.set(Math.cos(a)*.34,0,Math.sin(a)*.34);g.add(rib)}
 const cord=new THREE.Mesh(new THREE.CylinderGeometry(.012,.012,.45,6),brass);cord.position.y=.77;g.add(cord);
 const tassel=new THREE.Group();tassel.position.y=-.55;g.add(tassel);
 const knot=new THREE.Mesh(new THREE.SphereGeometry(.075,10,8),brass);tassel.add(knot);
 for(let i=0;i<9;i++){const strand=new THREE.Mesh(new THREE.CylinderGeometry(.009,.004,.52,5),material('#b64a32'));strand.position.set((i-4)*.018,-.28,0);strand.rotation.z=(i-4)*.035;tassel.add(strand)}
 const bulb=new THREE.PointLight(0xffad6b,17,7,2);bulb.position.y=-.04;g.add(bulb);lanternLights.push(bulb);
 return g;
}
function lanternString(x,z,y=6.3){beam(x,y,z,.025,.9,.025,0,'#6b4b2e')}
[[-5.9,5.8,1.8],[5.8,5.7,-4.4],[-5.9,5.7,-7.8],[5.8,5.8,-13.5],[-5.8,5.7,-19.4],[5.8,5.8,-25.2],[0,6.1,2.8],[0,6.1,-5.2],[0,6.1,-12.2],[0,6.1,-20.5]].forEach((p,i)=>{lanternString(p[0],p[2],p[1]+.6);lantern(p[0],p[1],p[2],i%3===0?.88:.72,i%2?'#9b3027':'#b23b2b')});
// 旧货经营痕迹：纸箱、麻袋、搬运木托、红色手写价签（不拼造家具）
function crate(x,z,s=1){const c=material('#735638');mesh(new THREE.BoxGeometry(.8*s,.58*s,.7*s),c,x,.29*s,z);for(let y=.12;y<.58;y+=.18)beam(x,y*s,z,.84*s,.035*s,.74*s,0,'#98734b')}
function priceTag(x,y,z,text){const c=document.createElement('canvas');c.width=180;c.height=120;const g=c.getContext('2d');g.fillStyle='#b83c2b';g.fillRect(0,0,180,120);g.fillStyle='#f3dfb7';g.font='bold 38px serif';g.textAlign='center';g.fillText(text,90,73);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;const m=new THREE.MeshBasicMaterial({map:t,side:THREE.DoubleSide});mesh(new THREE.PlaneGeometry(.42,.28),m,x,y,z,0,0,0,false)}
crate(-6.4,7.5,.9);crate(6.2,7.2,.85);crate(-6.4,-9,.9);crate(6.5,-16,.8);
priceTag(-5.2,1.3,1.8,'旧木器');priceTag(5.8,1.55,-8.6,'可议价');priceTag(-5.9,1.1,-15.5,'老家具');

// 独立旧货摊档：每档都有棚架、遮阳布、柜台、背架和手写招牌
// 这里只用几何体搭建摊位建筑结构；家具陈列仍由真实模型资产承担
function marketStall(x,z,side,variant=0){
 const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=side>0?Math.PI/2:-Math.PI/2;scene.add(g);
 const w=3.65+(variant%2)*.45,d=3.25+(variant%3)*.22;
 const postMat=material(variant%2?'#493526':'#5a4030');
 const canvasMats=[material('#8b6044'),material('#6f7460'),material('#9a7956'),material('#6f4d3a')];
 const canopy=canvasMats[variant%canvasMats.length];
 const rusty=material('#4b4940',.72,.48);
 // 四角立柱与横梁
 for(const lx of [-w/2,w/2])for(const lz of [-d/2,d/2]){
  const p=new THREE.Mesh(new THREE.BoxGeometry(.13,3.05,.13),postMat);p.position.set(lx,1.52,lz);p.castShadow=true;p.receiveShadow=true;g.add(p);
 }
 const top=new THREE.Mesh(new THREE.BoxGeometry(w+.22,.16,d+.22),postMat);top.position.set(0,3.02,0);top.castShadow=true;g.add(top);
 // 略微倾斜的旧帆布棚顶和前沿垂布
 const roofMesh=new THREE.Mesh(new THREE.BoxGeometry(w+.42,.12,d+.48),canopy);roofMesh.position.set(0,3.18,0);roofMesh.rotation.x=-.045;roofMesh.castShadow=true;roofMesh.receiveShadow=true;g.add(roofMesh);
 const valance=new THREE.Mesh(new THREE.BoxGeometry(w+.36,.48,.09),canopy);valance.position.set(0,2.88,d/2+.17);g.add(valance);
 // 后墙、半高侧挡板，形成真正的摊位空间
 const back=new THREE.Mesh(new THREE.BoxGeometry(w,2.15,.12),material('#665747'));back.position.set(0,1.12,-d/2);back.castShadow=true;g.add(back);
 for(const lx of [-w/2,w/2]){
  const sideWall=new THREE.Mesh(new THREE.BoxGeometry(.1,1.35,d*.7),material('#75634e'));sideWall.position.set(lx,.68,-d*.08);g.add(sideWall);
 }
 // 旧木柜台与下方堆货空间
 const counter=new THREE.Mesh(new THREE.BoxGeometry(w*.84,.16,.78),material('#76583b'));counter.position.set(0,1.02,d*.28);counter.castShadow=true;g.add(counter);
 const counterFront=new THREE.Mesh(new THREE.BoxGeometry(w*.84,.82,.1),material('#59432f'));counterFront.position.set(0,.53,d*.65);g.add(counterFront);
 // 背部陈列架：层板、竖向分隔
 for(const yy of [.9,1.65,2.35]){
  const shelf=new THREE.Mesh(new THREE.BoxGeometry(w*.82,.09,.42),material('#806345'));shelf.position.set(0,yy,-d/2+.28);shelf.castShadow=true;g.add(shelf);
 }
 for(const lx of [-w*.34,0,w*.34]){
  const divider=new THREE.Mesh(new THREE.BoxGeometry(.07,1.55,.38),postMat);divider.position.set(lx,1.62,-d/2+.28);g.add(divider);
 }
 // 摊位前沿金属管与灯泡
 const rail=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,w,8),rusty);rail.rotation.z=Math.PI/2;rail.position.set(0,2.55,d/2+.12);g.add(rail);
 const bulb=new THREE.Mesh(new THREE.SphereGeometry(.09,10,8),new THREE.MeshBasicMaterial({color:0xffd49a}));bulb.position.set(0,2.55,d/2+.2);g.add(bulb);
 const lamp=new THREE.PointLight(0xffc78b,5,4);lamp.position.set(0,2.35,d/2+.12);g.add(lamp);
 // 老式家居照片墙：每档挂两幅带木框的生活场景照片
 function homePhoto(kind){
  const c=document.createElement('canvas');c.width=420;c.height=300;const q=c.getContext('2d');
  const bg=q.createLinearGradient(0,0,0,300);bg.addColorStop(0,'#d8c5a1');bg.addColorStop(1,'#80644a');q.fillStyle=bg;q.fillRect(0,0,420,300);
  q.fillStyle='#b9a17c';q.fillRect(18,18,384,264);q.fillStyle='#d4c3a3';q.fillRect(32,30,356,238);
  // 老房子的墙面、窗户和水磨石地面
  q.fillStyle='#c8b18b';q.fillRect(34,32,352,154);q.fillStyle='#8c9a8b';q.fillRect(48,48,95,112);
  q.strokeStyle='#5d4b38';q.lineWidth=8;q.strokeRect(48,48,95,112);q.beginPath();q.moveTo(95,48);q.lineTo(95,160);q.moveTo(48,104);q.lineTo(143,104);q.stroke();
  q.fillStyle='#9b7d58';q.fillRect(34,190,352,72);
  // 墙上挂钟与旧日历
  q.fillStyle='#e8d8b5';q.fillRect(310,52,48,65);q.fillStyle='#9a3026';q.font='bold 24px serif';q.fillText('福',322,88);
  q.beginPath();q.arc(250,78,22,0,Math.PI*2);q.fillStyle='#e2d3b5';q.fill();q.strokeStyle='#594532';q.lineWidth=4;q.stroke();
  // 依主题绘制老式家具轮廓：木沙发、八仙桌或电视柜
  q.fillStyle=kind%3===0?'#65452f':kind%3===1?'#765137':'#59402d';
  if(kind%3===0){q.fillRect(88,150,190,48);q.fillRect(76,132,24,66);q.fillRect(266,132,24,66);q.fillRect(100,195,12,34);q.fillRect(254,195,12,34);q.fillStyle='#b18b62';q.fillRect(105,158,155,28)}
  else if(kind%3===1){q.fillRect(105,178,180,18);q.fillRect(120,196,12,42);q.fillRect(260,196,12,42);q.fillRect(95,170,200,10)}
  else{q.fillRect(94,158,210,58);q.fillRect(106,216,14,24);q.fillRect(278,216,14,24);q.fillStyle='#302b26';q.fillRect(138,168,118,42)}
